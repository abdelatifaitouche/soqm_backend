name: Backend CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to GHCR
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      # 3. Build Docker image
      - name: Build image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/soqm-backend:latest .

      # 4. Push Docker image
      - name: Push image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/soqm-backend:latest

      # 5. Setup SSH key
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 6. Deploy on VPS (migrations FIRST, then restart)
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd /opt/soqm_backend

            echo "Pulling latest image..."
            docker compose pull

            echo "Running database migrations (Alembic)..."
            docker compose run --rm api alembic upgrade head

            echo "Starting containers..."
            docker compose up -d

            echo "Running seed script safely..."
            docker exec fastapi_app python seed_db.py || true

            echo "Deployment complete."
          EOF
